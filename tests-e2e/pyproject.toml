[project]
name = "rag-llm-e2e"
version = "0.1.0"
description = "E2E integration tests for RAG-LLM monorepo (Phase B3)"
requires-python = ">=3.12"

[project.optional-dependencies]
e2e = [
    "testcontainers>=4.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "PyJWT>=2.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
