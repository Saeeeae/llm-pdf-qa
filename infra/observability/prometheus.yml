global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: m1-identity
    static_configs:
      - targets: ['m1-identity:8000']
    metrics_path: /metrics

  - job_name: m2-doc-to-md
    static_configs:
      - targets: ['m2-doc-to-md:8000']
    metrics_path: /metrics

  - job_name: m3-chunk-embed
    static_configs:
      - targets: ['m3-chunk-embed:8000']
    metrics_path: /metrics

  - job_name: m4-rag
    static_configs:
      - targets: ['m4-rag:8000']
    metrics_path: /metrics

  - job_name: m5-gateway
    static_configs:
      - targets: ['m5-gateway:9090']
    metrics_path: /metrics

  - job_name: m7-admin-be
    static_configs:
      - targets: ['m7-admin-backend:8000']
    metrics_path: /metrics

  - job_name: m8-web-search
    static_configs:
      - targets: ['m8-web-search:8000']
    metrics_path: /metrics
