server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: rag-audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: rag-audit
          __path__: /var/log/rag-audit/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            ts: ts
            action: action
            user_id: user_id
      - timestamp:
          source: ts
          format: Unix
      - labels:
          action: action

  - job_name: system-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/syslog
