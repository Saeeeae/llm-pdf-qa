# Host-side persistent storage layout (configurable via env):
#   DATA_ROOT  (default /data)   — DBs, model cache, markdown output, logs, pipeline state
#   DATA2_ROOT (default /data2)  — raw input documents (read-only source for m2)
#
# Layout under DATA_ROOT:
#   ${DATA_ROOT}/db/postgres   — Postgres PGDATA
#   ${DATA_ROOT}/db/neo4j      — Neo4j data
#   ${DATA_ROOT}/db/redis      — Redis AOF/RDB
#   ${DATA_ROOT}/models        — HuggingFace cache (HF_HOME) shared by m3, m4
#   ${DATA_ROOT}/markdown      — m2 output, m3 input
#   ${DATA_ROOT}/state         — m2 pipeline state, DLQ
#   ${DATA_ROOT}/logs          — m2/m5/m7 file logs, m8 audit jsonl
#
# Make sure the host directories exist and are writable by the container UID:
#   sudo mkdir -p /data/db/{postgres,neo4j,redis} /data/models /data/markdown /data/state /data/logs /data2
#   sudo chown -R 1000:1000 /data /data2  (or whatever UID the images use)

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ${DATA_ROOT:-/data}/db/postgres:/var/lib/postgresql/data
    networks:
      - ragnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ${DATA_ROOT:-/data}/db/neo4j:/data
    networks:
      - ragnet
    healthcheck:
      test: ["CMD-SHELL", "wget -O- http://localhost:7474/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ${DATA_ROOT:-/data}/db/redis:/data
    networks:
      - ragnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  ragnet:
    driver: bridge
    internal: ${RAGNET_INTERNAL:-true}
  web_egress:
    driver: bridge
