services:
  m4-rag:
    build:
      context: ../..
      dockerfile: modules/m4-rag/Dockerfile
    ports:
      - "8104:8000"
    env_file:
      - ${ROOT}/.env
    environment:
      MODULE_IMPL: ${MODULE_IMPL:-real}
    volumes:
      - ${LOG_DIR:-./data/logs}/m4-rag:/var/log/m4-rag
    networks:
      - ragnet

networks:
  ragnet:
    external: true
