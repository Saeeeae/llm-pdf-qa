services:
  m2-doc-to-md:
    build:
      context: ../..
      dockerfile: modules/m2-doc-to-md/Dockerfile
    ports:
      - "8102:8000"
    env_file:
      - ${ROOT}/.env
    environment:
      MODULE_IMPL: ${MODULE_IMPL:-real}
      M2_STATE_DIR: /app/.state
      LOG_FILE_PATH: /var/log/m2-doc-to-md/m2-doc-to-md.log
    volumes:
      - ${LOG_DIR:-./data/logs}/m2-doc-to-md:/var/log/m2-doc-to-md
      - ${DATA_DIR:-./data/db}/m2-state:/app/.state
    networks:
      - ragnet

networks:
  ragnet:
    external: true
