services:
  m3-chunk-embed:
    build:
      context: ../..
      dockerfile: modules/m3-chunk-embed/Dockerfile
    ports:
      - "8103:8000"
    env_file:
      - ${ROOT}/.env
    environment:
      MODULE_IMPL: ${MODULE_IMPL:-real}
    volumes:
      - ${LOG_DIR:-./data/logs}/m3-chunk-embed:/var/log/m3-chunk-embed
    networks:
      - ragnet

networks:
  ragnet:
    external: true
