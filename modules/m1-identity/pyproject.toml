[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "m1-identity"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.0",
    "httpx>=0.25",
    "rag-shared",
    "sqlalchemy>=2.0",
    "argon2-cffi>=23.1",
    "asyncpg>=0.29",
    "redis>=5",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "asyncmy>=0.2.9",
    "apscheduler>=3.10",
    "passlib[argon2,bcrypt]>=1.7.4",
]

[tool.setuptools.packages.find]
where = ["."]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.25", "aiosqlite>=0.20"]
