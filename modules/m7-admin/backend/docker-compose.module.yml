services:
  m7-admin:
    build:
      context: ../../..
      dockerfile: modules/m7-admin/backend/Dockerfile
    ports:
      - "8107:8000"
    env_file:
      - ${ROOT}/.env
    environment:
      MODULE_IMPL: ${MODULE_IMPL:-real}
    volumes:
      - ${LOG_DIR:-./data/logs}/m7-admin:/var/log/m7-admin
    networks:
      - ragnet

networks:
  ragnet:
    external: true
