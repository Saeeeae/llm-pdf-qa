openapi: "3.1.0"
info:
  title: M2 Doc-to-MD Ingest
  version: "0.1.0"
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  module:
                    type: string
                    example: m2-doc-to-md
  /ingest/scan:
    post:
      summary: Trigger a full document scan
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [full, incremental]
                  default: incremental
      responses:
        "202":
          description: Scan accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                    example: accepted
  /ingest/status:
    get:
      summary: Get current ingest status
      responses:
        "200":
          description: Status info
          content:
            application/json:
              schema:
                type: object
                properties:
                  running:
                    type: boolean
                  last_run:
                    type: string
                    format: date-time
                  docs_processed:
                    type: integer
